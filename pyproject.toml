[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mousegpt"
version = "0.1.0"
description = "A voice-controlled computer automation engine using natural language commands"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MouseGPT Team"}
]
keywords = ["voice-control", "automation", "speech-recognition", "mouse-control", "keyboard-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.13",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "openai>=1.0.0",
    "pyttsx3>=2.90",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
whisper = [
    "openai-whisper>=20231117",
]

[project.scripts]
mousegpt = "mousegpt.main:main"

[project.urls]
Homepage = "https://github.com/treesbeats/ai-computer-automation"
Repository = "https://github.com/treesbeats/ai-computer-automation"

[tool.setuptools.packages.find]
where = ["."]
include = ["mousegpt*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
